<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciar Enquetes | J&T Express</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23B3261E'/%3E%3Ctext x='50%25' y='56%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='900' font-size='26'%3EJ%26T%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FFFFFF; color: #1D1B20; }
    .m3-surface { background-color: #FFF8F7; border: 1px solid #F5DDDA; }
    .m3-btn-primary { background-color: #B3261E; color: #FFFFFF; }
    .m3-btn-primary:hover { background-color: #8C1D18; }
  </style>
</head>
<body class="min-h-screen bg-white hidden" id="corpoProtegido">
  <header class="border-b border-red-100 bg-white sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/acesso" class="w-10 h-10 rounded-2xl bg-[#FCEEEE] text-[#B3261E] flex items-center justify-center">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <span class="text-[11px] font-bold uppercase tracking-widest text-[#B3261E] block">Módulo Administrativo</span>
          <h1 class="text-base font-extrabold text-neutral-900">Criação e Controle de Enquetes</h1>
        </div>
      </div>
      <a href="/acesso" class="px-4 py-2 rounded-full text-xs font-bold border border-neutral-300 text-neutral-700">Painel Central</a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">
    <section class="m3-surface rounded-[28px] p-6 space-y-5">
      <h2 class="text-lg font-extrabold text-neutral-900">Criar / Liberar Nova Enquete</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="text-xs font-bold text-neutral-700 block mb-1">Título da Enquete</label>
          <input id="tituloEnquete" type="text" placeholder="Ex: Escala Oficial Noturna" class="w-full px-4 py-3 rounded-2xl border border-neutral-300 bg-white text-sm font-bold" />
        </div>
        <div>
          <label class="text-xs font-bold text-neutral-700 block mb-1">Data da Jornada (Automática Hoje)</label>
          <input id="dataJornada" type="date" class="w-full px-4 py-3 rounded-2xl border border-neutral-300 bg-white text-sm font-bold" />
        </div>
        <div>
          <label class="text-xs font-bold text-neutral-700 block mb-1">Auto-renovar por quantos dias?</label>
          <input id="diasRenovacao" type="number" min="0" max="60" value="7" class="w-full px-4 py-3 rounded-2xl border border-neutral-300 bg-white text-sm font-bold" />
        </div>
      </div>

      <div class="space-y-2">
        <label class="text-xs font-bold text-neutral-700 block">Selecione os Horários Definidos na Aba Escala:</label>
        <div id="seletorHorariosEscala" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
      </div>

      <div class="flex justify-end">
        <button onclick="criarEnquete()" class="m3-btn-primary px-7 py-3 rounded-full text-xs font-extrabold flex items-center gap-2">
          <span class="material-symbols-rounded text-base">publish</span>
          Publicar Enquete e Pré-confirmar Fixos/Preferenciais
        </button>
      </div>
    </section>

    <section class="space-y-4">
      <h3 class="text-base font-extrabold text-neutral-900">Enquetes Publicadas</h3>
      <div id="listaEnquetesAdmin" class="space-y-4"></div>
    </section>
  </main>

  <script>
    const API_BASE = "https://jtexpress-diariasonline.grupo-bhds.workers.dev";
    let estadoAtual = null;

    async function validarAcessoSubpasta() {
      const token = sessionStorage.getItem("JT_ADMIN_TOKEN");
      const gatewayPassed = sessionStorage.getItem("JT_GATEWAY_PASSED");
      const referrerValido = document.referrer.includes("/acesso") || Boolean(sessionStorage.getItem("JT_SUBPAGE_AUTH_HOP"));

      if (!token || gatewayPassed !== "TRUE" || !referrerValido) {
        window.location.replace("/acesso");
        return;
      }

      try {
        const resp = await fetch(API_BASE + "/api/admin/state", {
          headers: { "X-Admin-Token": token, "X-Subpage-Origin": "/acesso/enquete" }
        });
        const json = await resp.json();
        if (!json.ok) {
          window.location.replace("/acesso");
          return;
        }
        document.getElementById("corpoProtegido").classList.remove("hidden");
        estadoAtual = json.data;
        document.getElementById("dataJornada").value = json.hoje;
        renderizarTela();
      } catch (e) {
        window.location.replace("/acesso");
      }
    }

    function renderizarTela() {
      const boxHorarios = document.getElementById("seletorHorariosEscala");
      const escalas = estadoAtual.escalas || [];
      boxHorarios.innerHTML = escalas.map(function(e, idx) {
        return `<label class="flex items-center justify-between p-3.5 rounded-2xl bg-white border border-red-100 cursor-pointer">
          <div class="flex items-center gap-2.5">
            <input type="checkbox" data-idx="${idx}" class="chk-escala-enquete accent-[#B3261E] w-4 h-4" checked />
            <span class="text-sm font-extrabold text-neutral-900">${e.horarioInicial} às ${e.horarioFinal}</span>
          </div>
          <span class="text-xs font-bold text-[#B3261E]">Int: ${e.intervalo} • VD ${e.vd}</span>
        </label>`;
      }).join("");

      const listaAdmin = document.getElementById("listaEnquetesAdmin");
      const enquetes = estadoAtual.enquetes || [];
      if (enquetes.length === 0) {
        listaAdmin.innerHTML = `<p class="text-xs text-neutral-400">Nenhuma enquete ativa.</p>`;
        return;
      }

      listaAdmin.innerHTML = enquetes.map(function(enq, iEnq) {
        const horariosHtml = (enq.horarios || []).map(function(h, iH) {
          const cid = "adm_col_" + iEnq + "_" + iH;
          const parts = (h.participantes || []).map(function(p, ord) {
            return `<div class="flex items-center justify-between py-1.5 px-3 rounded-xl bg-neutral-50 text-xs">
              <span class="font-bold">${ord + 1}º — ${p.nome} (${p.cpf})</span>
              <span class="font-extrabold text-[#B3261E]">${p.preferencial === "Sim" ? "PREFERENCIAL" : (p.fixo === "Sim" ? "FIXO" : "COMUM")} • ${p.status}</span>
            </div>`;
          }).join("");

          return `<div class="bg-white p-4 rounded-2xl border border-neutral-200 space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-sm font-extrabold">${h.horarioInicial} às ${h.horarioFinal} (VD ${h.vd} | VA ${h.va} | VT ${h.vt})</span>
              <button onclick="document.getElementById('${cid}').classList.toggle('hidden')" class="px-3 py-1 rounded-full text-xs font-bold bg-red-50 text-[#B3261E]">
                Recolher / Ver Lista (${(h.participantes || []).length})
              </button>
            </div>
            <div id="${cid}" class="space-y-1 pt-2 border-t border-neutral-100">${parts || '<p class="text-xs text-neutral-400">Sem confirmações</p>'}</div>
          </div>`;
        }).join("");

        return `<div class="m3-surface p-5 rounded-3xl space-y-3">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-xs font-bold text-[#B3261E]">Data da Jornada: ${enq.dataJornada} • Auto-renovação restante: ${enq.diasRestantesRenovacao} dia(s)</span>
              <h4 class="text-base font-extrabold text-neutral-900">${enq.titulo}</h4>
            </div>
            <button onclick="excluirEnquete('${enq.id}')" class="px-4 py-2 rounded-full text-xs font-bold bg-red-600 text-white">Excluir</button>
          </div>
          <div class="space-y-2">${horariosHtml}</div>
        </div>`;
      }).join("");
    }

    async function criarEnquete() {
      const token = sessionStorage.getItem("JT_ADMIN_TOKEN");
      const titulo = document.getElementById("tituloEnquete").value.trim();
      const dataJornada = document.getElementById("dataJornada").value;
      const diasRenovacao = Number(document.getElementById("diasRenovacao").value || 0);
      const marcados = document.querySelectorAll(".chk-escala-enquete:checked");
      const horarios = [];
      marcados.forEach(function(c) {
        horarios.push(estadoAtual.escalas[Number(c.getAttribute("data-idx"))]);
      });

      const resp = await fetch(API_BASE + "/api/admin/enquete/salvar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Admin-Token": token,
          "X-Subpage-Origin": "/acesso/enquete"
        },
        body: JSON.stringify({ titulo, dataJornada, diasRenovacao, horarios })
      });
      const json = await resp.json();
      if (json.ok) validarAcessoSubpasta();
    }

    async function excluirEnquete(id) {
      const token = sessionStorage.getItem("JT_ADMIN_TOKEN");
      await fetch(API_BASE + "/api/admin/enquete/excluir", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Admin-Token": token,
          "X-Subpage-Origin": "/acesso/enquete"
        },
        body: JSON.stringify({ id })
      });
      validarAcessoSubpasta();
    }

    validarAcessoSubpasta();
  </script>
</body>
</html>
