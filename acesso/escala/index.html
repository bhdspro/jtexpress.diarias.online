<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrar Escala | J&T Express</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23B3261E'/%3E%3Ctext x='50%25' y='56%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='900' font-size='26'%3EJ%26T%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FFFFFF; color: #1D1B20; }
    .m3-surface { background-color: #FFF8F7; border: 1px solid #F5DDDA; }
    .m3-btn-primary { background-color: #B3261E; color: #FFFFFF; }
  </style>
</head>
<body class="min-h-screen bg-white hidden" id="corpoProtegido">
  <header class="border-b border-red-100 bg-white sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/acesso" class="w-10 h-10 rounded-2xl bg-[#FCEEEE] text-[#B3261E] flex items-center justify-center">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <span class="text-[11px] font-bold uppercase tracking-widest text-[#B3261E] block">Módulo Administrativo</span>
          <h1 class="text-base font-extrabold text-neutral-900">Gerenciamento de Horários da Aba Escala</h1>
        </div>
      </div>
      <button onclick="salvarEscalas()" class="m3-btn-primary px-6 py-2.5 rounded-full text-xs font-extrabold">Salvar Alterações na Aba Escala</button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">
    <section class="m3-surface rounded-[28px] p-6 space-y-4">
      <h2 class="text-base font-extrabold text-neutral-900">Adicionar Novo Horário na Escala</h2>
      <div class="grid grid-cols-2 md:grid-cols-6 gap-3">
        <input id="eIni" type="text" placeholder="Início (20:00)" class="px-3 py-2.5 rounded-2xl border bg-white text-xs font-bold" />
        <input id="eFim" type="text" placeholder="Final (06:20)" class="px-3 py-2.5 rounded-2xl border bg-white text-xs font-bold" />
        <input id="eInt" type="text" placeholder="Intervalo (1h)" class="px-3 py-2.5 rounded-2xl border bg-white text-xs font-bold" />
        <input id="eTurno" type="text" placeholder="Turno (4)" class="px-3 py-2.5 rounded-2xl border bg-white text-xs font-bold" />
        <input id="eCarga" type="text" placeholder="Carga (09:20)" class="px-3 py-2.5 rounded-2xl border bg-white text-xs font-bold" />
        <input id="eVd" type="text" placeholder="VD (R$110,00)" class="px-3 py-2.5 rounded-2xl border bg-white text-xs font-bold" />
        <input id="eVa" type="text" placeholder="VA (R$20,00)" value="R$20,00" class="px-3 py-2.5 rounded-2xl border bg-white text-xs font-bold" />
        <input id="eVt" type="text" placeholder="VT (R$20,00)" value="R$20,00" class="px-3 py-2.5 rounded-2xl border bg-white text-xs font-bold" />
        <input id="ePonto" type="text" value="https://tsi-app.com/facial" class="px-3 py-2.5 rounded-2xl border bg-white text-xs font-bold" />
        <input id="eUser" type="text" value="JTPR15" class="px-3 py-2.5 rounded-2xl border bg-white text-xs font-bold" />
        <input id="ePass" type="text" value="fab226" class="px-3 py-2.5 rounded-2xl border bg-white text-xs font-bold" />
        <button onclick="adicionarHorario()" class="m3-btn-primary rounded-2xl text-xs font-extrabold py-2.5">Adicionar Horário</button>
      </div>
    </section>

    <section class="overflow-x-auto border border-red-100 rounded-3xl">
      <table class="w-full text-left text-xs">
        <thead class="bg-[#B3261E] text-white uppercase font-extrabold">
          <tr>
            <th class="p-3">Início</th>
            <th class="p-3">Final</th>
            <th class="p-3">Intervalo</th>
            <th class="p-3">Turno</th>
            <th class="p-3">Carga</th>
            <th class="p-3">VD</th>
            <th class="p-3">VA</th>
            <th class="p-3">VT</th>
            <th class="p-3">Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaEscalaBody" class="divide-y divide-red-100"></tbody>
      </table>
    </section>
  </main>

  <script>
    const API_BASE = "https://jtexpress-diariasonline.grupo-bhds.workers.dev";
    let escalas = [];

    async function validarAcesso() {
      const token = sessionStorage.getItem("JT_ADMIN_TOKEN");
      if (!token || sessionStorage.getItem("JT_GATEWAY_PASSED") !== "TRUE") {
        window.location.replace("/acesso");
        return;
      }
      const resp = await fetch(API_BASE + "/api/admin/state", {
        headers: { "X-Admin-Token": token, "X-Subpage-Origin": "/acesso/escala" }
      });
      const json = await resp.json();
      if (!json.ok) {
        window.location.replace("/acesso");
        return;
      }
      document.getElementById("corpoProtegido").classList.remove("hidden");
      escalas = json.data.escalas || [];
      renderizarEscalas();
    }

    function renderizarEscalas() {
      const tbody = document.getElementById("tabelaEscalaBody");
      tbody.innerHTML = escalas.map(function(e, i) {
        return `<tr>
          <td class="p-2.5"><input value="${e.horarioInicial}" onchange="escalas[${i}].horarioInicial=this.value" class="w-20 px-2 py-1 border rounded font-bold" /></td>
          <td class="p-2.5"><input value="${e.horarioFinal}" onchange="escalas[${i}].horarioFinal=this.value" class="w-20 px-2 py-1 border rounded font-bold" /></td>
          <td class="p-2.5"><input value="${e.intervalo}" onchange="escalas[${i}].intervalo=this.value" class="w-16 px-2 py-1 border rounded font-bold" /></td>
          <td class="p-2.5"><input value="${e.turno}" onchange="escalas[${i}].turno=this.value" class="w-14 px-2 py-1 border rounded font-bold" /></td>
          <td class="p-2.5"><input value="${e.cargaHoraria}" onchange="escalas[${i}].cargaHoraria=this.value" class="w-20 px-2 py-1 border rounded font-bold" /></td>
          <td class="p-2.5"><input value="${e.vd}" onchange="escalas[${i}].vd=this.value" class="w-24 px-2 py-1 border rounded font-bold" /></td>
          <td class="p-2.5"><input value="${e.va}" onchange="escalas[${i}].va=this.value" class="w-24 px-2 py-1 border rounded font-bold" /></td>
          <td class="p-2.5"><input value="${e.vt}" onchange="escalas[${i}].vt=this.value" class="w-24 px-2 py-1 border rounded font-bold" /></td>
          <td class="p-2.5"><button onclick="escalas.splice(${i},1);renderizarEscalas()" class="px-3 py-1 rounded-full bg-red-600 text-white font-bold">Excluir</button></td>
        </tr>`;
      }).join("");
    }

    function adicionarHorario() {
      escalas.push({
        horarioInicial: document.getElementById("eIni").value.trim(),
        horarioFinal: document.getElementById("eFim").value.trim(),
        intervalo: document.getElementById("eInt").value.trim(),
        turno: document.getElementById("eTurno").value.trim(),
        cargaHoraria: document.getElementById("eCarga").value.trim(),
        vd: document.getElementById("eVd").value.trim(),
        va: document.getElementById("eVa").value.trim(),
        vt: document.getElementById("eVt").value.trim(),
        registroPonto: document.getElementById("ePonto").value.trim(),
        usuario: document.getElementById("eUser").value.trim(),
        senha: document.getElementById("ePass").value.trim(),
        observacoes: ""
      });
      renderizarEscalas();
    }

    async function salvarEscalas() {
      const token = sessionStorage.getItem("JT_ADMIN_TOKEN");
      await fetch(API_BASE + "/api/admin/escala/salvar-lista", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Admin-Token": token,
          "X-Subpage-Origin": "/acesso/escala"
        },
        body: JSON.stringify({ escalas })
      });
      alert("Horários da aba Escala salvos em tempo real!");
    }

    validarAcesso();
  </script>
</body>
</html>
