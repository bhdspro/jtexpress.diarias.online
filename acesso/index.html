<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo | J&T Express — Diárias Online</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23B3261E'/%3E%3Ctext x='50%25' y='56%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='900' font-size='26'%3EJ%26T%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FFFFFF; color: #1D1B20; }
    .m3-card { background-color: #FFF8F7; border: 1px solid #F5DDDA; transition: all 0.22s ease; }
    .m3-card:hover { transform: translateY(-3px); border-color: #B3261E; box-shadow: 0 16px 32px -12px rgba(179, 38, 30, 0.22); }
    .m3-btn-primary { background-color: #B3261E; color: #FFFFFF; }
    .m3-btn-primary:hover { background-color: #8C1D18; }
  </style>
</head>
<body class="min-h-screen bg-white">
  <div id="telaLogin" class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-[#FFF8F7] border border-red-200 rounded-[32px] p-8 space-y-6 shadow-xl">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-[#B3261E] text-white font-extrabold flex items-center justify-center text-lg">J&T</div>
        <div>
          <span class="text-xs font-extrabold uppercase tracking-wider text-[#B3261E]">Acesso Restrito</span>
          <h1 class="text-xl font-extrabold text-neutral-900">Painel Administrativo</h1>
        </div>
      </div>
      <p class="text-xs text-neutral-600">Digite a senha administrativa salva na aba <strong>Config</strong> do banco de dados para desbloquear os módulos.</p>
      <div class="space-y-3">
        <input id="senhaAdminInput" type="password" placeholder="Senha de acesso" class="w-full px-4 py-3.5 rounded-2xl border border-neutral-300 bg-white font-bold text-center text-lg tracking-widest focus:border-[#B3261E] focus:outline-none" />
        <p id="erroLogin" class="text-xs font-bold text-[#B3261E] text-center hidden"></p>
        <button onclick="autenticarAdmin()" class="w-full m3-btn-primary py-3.5 rounded-full font-extrabold text-sm flex items-center justify-center gap-2">
          <span class="material-symbols-rounded text-base">lock_open</span>
          Liberar Painel Administrativo
        </button>
      </div>
      <div class="text-center">
        <a href="/" class="text-xs font-bold text-neutral-500 hover:text-[#B3261E]">Voltar para a Página Inicial</a>
      </div>
    </div>
  </div>

  <div id="painelCards" class="hidden min-h-screen flex flex-col">
    <header class="border-b border-red-100 bg-white sticky top-0 z-20">
      <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-[#B3261E] text-white font-extrabold flex items-center justify-center">J&T</div>
          <div>
            <span class="text-[11px] font-bold uppercase tracking-widest text-[#B3261E] block">Central de Comando</span>
            <h2 class="text-base font-extrabold text-neutral-900">Painel Administrativo</h2>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <a href="/" class="px-4 py-2 rounded-full text-xs font-bold border border-neutral-200 text-neutral-700 hover:bg-neutral-50">Ver Site</a>
          <button onclick="encerrarSessao()" class="px-4 py-2 rounded-full text-xs font-bold bg-neutral-900 text-white hover:bg-neutral-700">Sair</button>
        </div>
      </div>
    </header>

    <main class="max-w-5xl w-full mx-auto px-4 py-10 grid grid-cols-1 md:grid-cols-3 gap-5">
      <button onclick="navegarSubpasta('/acesso/enquete')" class="m3-card rounded-[28px] p-6 text-left space-y-3">
        <div class="w-12 h-12 rounded-2xl bg-[#B3261E] text-white flex items-center justify-center">
          <span class="material-symbols-rounded">how_to_vote</span>
        </div>
        <h3 class="text-lg font-extrabold text-neutral-900">Enquete</h3>
        <p class="text-xs text-neutral-600">Criar e liberar enquetes de disponibilidade com auto-renovação e pré-confirmação inteligente.</p>
      </button>

      <button onclick="navegarSubpasta('/acesso/demanda')" class="m3-card rounded-[28px] p-6 text-left space-y-3">
        <div class="w-12 h-12 rounded-2xl bg-[#B3261E] text-white flex items-center justify-center">
          <span class="material-symbols-rounded">campaign</span>
        </div>
        <h3 class="text-lg font-extrabold text-neutral-900">Demanda</h3>
        <p class="text-xs text-neutral-600">Liberar quantidade de vagas por horário e acionar chamada automática no WhatsApp após 10 minutos.</p>
      </button>

      <button onclick="navegarSubpasta('/acesso/diarista')" class="m3-card rounded-[28px] p-6 text-left space-y-3">
        <div class="w-12 h-12 rounded-2xl bg-[#B3261E] text-white flex items-center justify-center">
          <span class="material-symbols-rounded">group</span>
        </div>
        <h3 class="text-lg font-extrabold text-neutral-900">Diarista</h3>
        <p class="text-xs text-neutral-600">Adicionar, alterar, excluir, bloquear e definir diaristas como Fixos ou Preferenciais (VIP).</p>
      </button>

      <button onclick="navegarSubpasta('/acesso/escala')" class="m3-card rounded-[28px] p-6 text-left space-y-3">
        <div class="w-12 h-12 rounded-2xl bg-[#B3261E] text-white flex items-center justify-center">
          <span class="material-symbols-rounded">calendar_clock</span>
        </div>
        <h3 class="text-lg font-extrabold text-neutral-900">Escala</h3>
        <p class="text-xs text-neutral-600">Gerenciar turnos, horários iniciais e finais, intervalos e valores de VD, VA e VT.</p>
      </button>

      <button onclick="navegarSubpasta('/acesso/config')" class="m3-card rounded-[28px] p-6 text-left space-y-3">
        <div class="w-12 h-12 rounded-2xl bg-[#B3261E] text-white flex items-center justify-center">
          <span class="material-symbols-rounded">settings</span>
        </div>
        <h3 class="text-lg font-extrabold text-neutral-900">Configuração</h3>
        <p class="text-xs text-neutral-600">Alterar a senha de acesso salva em tempo real na aba Config e testar alertas da Green-API.</p>
      </button>
    </main>
  </div>

  <script>
    const API_BASE = "https://jtexpress-diariasonline.grupo-bhds.workers.dev";

    async function verificarSessaoExistente() {
      const token = sessionStorage.getItem("JT_ADMIN_TOKEN");
      const gatewayPass = sessionStorage.getItem("JT_GATEWAY_PASSED");
      if (!token || gatewayPass !== "TRUE") return;

      try {
        const resp = await fetch(API_BASE + "/api/admin/verify", {
          headers: { "X-Admin-Token": token, "X-Subpage-Origin": "/acesso" }
        });
        const json = await resp.json();
        if (json.ok && json.valid) {
          document.getElementById("telaLogin").classList.add("hidden");
          document.getElementById("painelCards").classList.remove("hidden");
        }
      } catch (e) {}
    }

    async function autenticarAdmin() {
      const senha = document.getElementById("senhaAdminInput").value.trim();
      const erroEl = document.getElementById("erroLogin");
      erroEl.classList.add("hidden");

      try {
        const resp = await fetch(API_BASE + "/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ senha })
        });
        const json = await resp.json();
        if (!json.ok) {
          erroEl.textContent = json.error || "Senha incorreta!";
          erroEl.classList.remove("hidden");
          return;
        }
        sessionStorage.setItem("JT_ADMIN_TOKEN", json.token);
        sessionStorage.setItem("JT_GATEWAY_PASSED", "TRUE");
        sessionStorage.setItem("JT_GATEWAY_NONCE", json.gatewayNonce);
        sessionStorage.setItem("JT_LAST_HUB_TIMESTAMP", String(Date.now()));
        document.getElementById("telaLogin").classList.add("hidden");
        document.getElementById("painelCards").classList.remove("hidden");
      } catch (e) {
        erroEl.textContent = "Falha de conexão com o servidor.";
        erroEl.classList.remove("hidden");
      }
    }

    function navegarSubpasta(destino) {
      sessionStorage.setItem("JT_SUBPAGE_AUTH_HOP", destino + "|" + Date.now());
      window.location.href = destino;
    }

    function encerrarSessao() {
      sessionStorage.clear();
      window.location.reload();
    }

    document.getElementById("senhaAdminInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") autenticarAdmin();
    });

    verificarSessaoExistente();
  </script>
</body>
</html>
