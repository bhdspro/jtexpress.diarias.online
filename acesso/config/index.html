<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações | J&T Express</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23B3261E'/%3E%3Ctext x='50%25' y='56%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='900' font-size='26'%3EJ%26T%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FFFFFF; color: #1D1B20; }
    .m3-surface { background-color: #FFF8F7; border: 1px solid #F5DDDA; }
    .m3-btn-primary { background-color: #B3261E; color: #FFFFFF; }
  </style>
</head>
<body class="min-h-screen bg-white hidden" id="corpoProtegido">
  <header class="border-b border-red-100 bg-white sticky top-0 z-20">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/acesso" class="w-10 h-10 rounded-2xl bg-[#FCEEEE] text-[#B3261E] flex items-center justify-center">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <span class="text-[11px] font-bold uppercase tracking-widest text-[#B3261E] block">Módulo Administrativo</span>
          <h1 class="text-base font-extrabold text-neutral-900">Configurações de Segurança e Green-API</h1>
        </div>
      </div>
      <a href="/acesso" class="px-4 py-2 rounded-full text-xs font-bold border border-neutral-300 text-neutral-700">Painel Central</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8 space-y-6">
    <section class="m3-surface rounded-[28px] p-6 space-y-4">
      <h2 class="text-lg font-extrabold text-neutral-900">Alterar Senha de Acesso (Aba Config)</h2>
      <p class="text-xs text-neutral-600">A nova senha atualiza imediatamente a célula B1 da aba Config no Google Sheets e o cache do Cloudflare KV.</p>
      <div class="flex flex-col md:flex-row gap-3">
        <input id="novaSenhaInput" type="text" placeholder="Digite a nova senha" class="flex-1 px-4 py-3 rounded-2xl border border-neutral-300 bg-white font-bold text-sm" />
        <button onclick="salvarNovaSenha()" class="m3-btn-primary px-7 py-3 rounded-full text-xs font-extrabold">Atualizar Senha Agora</button>
      </div>
    </section>

    <section class="m3-surface rounded-[28px] p-6 space-y-4">
      <h2 class="text-lg font-extrabold text-neutral-900">Disparo de Teste — Grupo de WhatsApp (Green-API)</h2>
      <button onclick="testarGreenApi()" class="px-6 py-3 rounded-full text-xs font-extrabold bg-neutral-900 text-white">Enviar Mensagem de Teste no Grupo</button>
    </section>
  </main>

  <script>
    const API_BASE = "https://jtexpress-diariasonline.grupo-bhds.workers.dev";

    async function validarAcesso() {
      const token = sessionStorage.getItem("JT_ADMIN_TOKEN");
      if (!token || sessionStorage.getItem("JT_GATEWAY_PASSED") !== "TRUE") {
        window.location.replace("/acesso");
        return;
      }
      const resp = await fetch(API_BASE + "/api/admin/state", {
        headers: { "X-Admin-Token": token, "X-Subpage-Origin": "/acesso/config" }
      });
      const json = await resp.json();
      if (!json.ok) {
        window.location.replace("/acesso");
        return;
      }
      document.getElementById("corpoProtegido").classList.remove("hidden");
      document.getElementById("novaSenhaInput").value = (json.data.config && json.data.config.senhaAcesso) || "";
    }

    async function salvarNovaSenha() {
      const token = sessionStorage.getItem("JT_ADMIN_TOKEN");
      const novaSenha = document.getElementById("novaSenhaInput").value.trim();
      const resp = await fetch(API_BASE + "/api/admin/config/senha", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Admin-Token": token,
          "X-Subpage-Origin": "/acesso/config"
        },
        body: JSON.stringify({ novaSenha })
      });
      const json = await resp.json();
      alert(json.message || json.error);
    }

    async function testarGreenApi() {
      const token = sessionStorage.getItem("JT_ADMIN_TOKEN");
      const resp = await fetch(API_BASE + "/api/admin/whatsapp/teste", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Admin-Token": token,
          "X-Subpage-Origin": "/acesso/config"
        },
        body: JSON.stringify({})
      });
      const json = await resp.json();
      alert(json.ok ? "Disparo solicitado à Green-API!" : "Erro ao testar Green-API.");
    }

    validarAcesso();
  </script>
</body>
</html>
