<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciar Demandas | J&T Express</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23B3261E'/%3E%3Ctext x='50%25' y='56%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='900' font-size='26'%3EJ%26T%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FFFFFF; color: #1D1B20; }
    .m3-surface { background-color: #FFF8F7; border: 1px solid #F5DDDA; }
    .m3-btn-primary { background-color: #B3261E; color: #FFFFFF; }
  </style>
</head>
<body class="min-h-screen bg-white hidden" id="corpoProtegido">
  <header class="border-b border-red-100 bg-white sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/acesso" class="w-10 h-10 rounded-2xl bg-[#FCEEEE] text-[#B3261E] flex items-center justify-center">
          <span class="material-symbols-rounded">arrow_back</span>
        </a>
        <div>
          <span class="text-[11px] font-bold uppercase tracking-widest text-[#B3261E] block">Módulo Administrativo</span>
          <h1 class="text-base font-extrabold text-neutral-900">Gerenciamento de Demandas e Vagas</h1>
        </div>
      </div>
      <a href="/acesso" class="px-4 py-2 rounded-full text-xs font-bold border border-neutral-300 text-neutral-700">Painel Central</a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">
    <section class="m3-surface rounded-[28px] p-6 space-y-4">
      <h2 id="formTituloDemanda" class="text-lg font-extrabold text-neutral-900">Liberar Nova Demanda</h2>
      <input type="hidden" id="demandaIdEdicao" value="" />
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-bold text-neutral-700 block mb-1">Data da Jornada</label>
          <input id="dataDemanda" type="date" class="w-full px-4 py-3 rounded-2xl border border-neutral-300 bg-white text-sm font-bold" />
        </div>
        <div>
          <label class="text-xs font-bold text-neutral-700 block mb-1">Observação da Demanda</label>
          <input id="obsDemanda" type="text" placeholder="Ex: Operação Noturna Reforço" class="w-full px-4 py-3 rounded-2xl border border-neutral-300 bg-white text-sm font-bold" />
        </div>
      </div>

      <div class="space-y-2">
        <label class="text-xs font-bold text-neutral-700 block">Defina a quantidade de vagas para cada horário desejado (0 = não incluir):</label>
        <div id="gradeVagasEscala" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
      </div>

      <div class="flex justify-end gap-2">
        <button onclick="limparFormularioDemanda()" class="px-5 py-3 rounded-full text-xs font-bold border border-neutral-300 text-neutral-700">Limpar</button>
        <button onclick="salvarDemanda()" class="m3-btn-primary px-7 py-3 rounded-full text-xs font-extrabold flex items-center gap-2">
          <span class="material-symbols-rounded text-base">send</span>
          Salvar Demanda e Agendar Cobrança (10 min)
        </button>
      </div>
    </section>

    <section class="space-y-4">
      <h3 class="text-base font-extrabold text-neutral-900">Demandas Cadastradas</h3>
      <div id="listaDemandasAdmin" class="space-y-4"></div>
    </section>
  </main>

  <script>
    const API_BASE = "https://jtexpress-diariasonline.grupo-bhds.workers.dev";
    let estado = null;

    async function validarAcesso() {
      const token = sessionStorage.getItem("JT_ADMIN_TOKEN");
      const gatewayPassed = sessionStorage.getItem("JT_GATEWAY_PASSED");
      if (!token || gatewayPassed !== "TRUE") {
        window.location.replace("/acesso");
        return;
      }
      const resp = await fetch(API_BASE + "/api/admin/state", {
        headers: { "X-Admin-Token": token, "X-Subpage-Origin": "/acesso/demanda" }
      });
      const json = await resp.json();
      if (!json.ok) {
        window.location.replace("/acesso");
        return;
      }
      document.getElementById("corpoProtegido").classList.remove("hidden");
      estado = json.data;
      document.getElementById("dataDemanda").value = json.hoje;
      renderizarDemandas();
    }

    function renderizarDemandas() {
      const grade = document.getElementById("gradeVagasEscala");
      grade.innerHTML = (estado.escalas || []).map(function(e, i) {
        return `<div class="flex items-center justify-between p-3.5 rounded-2xl bg-white border border-red-100">
          <div>
            <span class="text-sm font-extrabold text-neutral-900">${e.horarioInicial} às ${e.horarioFinal}</span>
            <span class="block text-[11px] font-bold text-[#B3261E]">VD ${e.vd} • Turno ${e.turno}</span>
          </div>
          <input type="number" min="0" value="0" data-idx="${i}" class="input-vaga-horario w-24 px-3 py-2 rounded-xl border border-neutral-300 text-center font-extrabold text-sm" />
        </div>`;
      }).join("");

      const lista = document.getElementById("listaDemandasAdmin");
      const demandas = estado.demandas || [];
      if (demandas.length === 0) {
        lista.innerHTML = `<p class="text-xs text-neutral-400">Nenhuma demanda cadastrada.</p>`;
        return;
      }

      lista.innerHTML = demandas.map(function(d) {
        const itensTxt = (d.itens || []).map(i => `<span class="px-3 py-1 rounded-full bg-white border border-red-200 text-xs font-bold">${i.horarioInicial}-${i.horarioFinal}: ${i.vagas} vaga(s)</span>`).join(" ");
        return `<div class="m3-surface p-5 rounded-3xl flex flex-wrap items-center justify-between gap-4">
          <div class="space-y-2">
            <span class="text-xs font-extrabold text-[#B3261E]">Data: ${d.dataJornada} • Alerta 10min: ${d.alerta10MinEnviado ? "Disparado" : "Agendado"}</span>
            <h4 class="text-base font-extrabold text-neutral-900">${d.observacao || "Demanda Padrão"}</h4>
            <div class="flex flex-wrap gap-2">${itensTxt}</div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick='editarDemanda(${JSON.stringify(d)})' class="px-4 py-2 rounded-full text-xs font-bold border border-neutral-300 bg-white">Editar</button>
            <button onclick='duplicarDemanda(${JSON.stringify(d)})' class="px-4 py-2 rounded-full text-xs font-bold bg-neutral-800 text-white">Duplicar</button>
            <button onclick="excluirDemanda('${d.id}')" class="px-4 py-2 rounded-full text-xs font-bold bg-red-600 text-white">Excluir</button>
          </div>
        </div>`;
      }).join("");
    }

    function editarDemanda(d) {
      document.getElementById("formTituloDemanda").textContent = "Editando Demanda";
      document.getElementById("demandaIdEdicao").value = d.id;
      document.getElementById("dataDemanda").value = d.dataJornada;
      document.getElementById("obsDemanda").value = d.observacao || "";
      document.querySelectorAll(".input-vaga-horario").forEach(function(inp) {
        const esc = estado.escalas[Number(inp.getAttribute("data-idx"))];
        const achou = (d.itens || []).find(x => x.horarioInicial === esc.horarioInicial && x.horarioFinal === esc.horarioFinal);
        inp.value = achou ? achou.vagas : 0;
      });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function duplicarDemanda(d) {
      editarDemanda(d);
      document.getElementById("formTituloDemanda").textContent = "Duplicando Demanda (Novo Registro)";
      document.getElementById("demandaIdEdicao").value = "";
    }

    function limparFormularioDemanda() {
      document.getElementById("formTituloDemanda").textContent = "Liberar Nova Demanda";
      document.getElementById("demandaIdEdicao").value = "";
      document.getElementById("obsDemanda").value = "";
      document.querySelectorAll(".input-vaga-horario").forEach(i => i.value = 0);
    }

    async function salvarDemanda() {
      const token = sessionStorage.getItem("JT_ADMIN_TOKEN");
      const id = document.getElementById("demandaIdEdicao").value.trim();
      const dataJornada = document.getElementById("dataDemanda").value;
      const observacao = document.getElementById("obsDemanda").value.trim();
      const itens = [];

      document.querySelectorAll(".input-vaga-horario").forEach(function(inp) {
        const vagas = Number(inp.value || 0);
        if (vagas > 0) {
          const esc = estado.escalas[Number(inp.getAttribute("data-idx"))];
          itens.push({
            horarioInicial: esc.horarioInicial,
            horarioFinal: esc.horarioFinal,
            vagas: vagas
          });
        }
      });

      const resp = await fetch(API_BASE + "/api/admin/demanda/salvar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Admin-Token": token,
          "X-Subpage-Origin": "/acesso/demanda"
        },
        body: JSON.stringify({ id: id || undefined, dataJornada, observacao, itens })
      });
      const json = await resp.json();
      if (json.ok) {
        limparFormularioDemanda();
        validarAcesso();
      }
    }

    async function excluirDemanda(id) {
      const token = sessionStorage.getItem("JT_ADMIN_TOKEN");
      await fetch(API_BASE + "/api/admin/demanda/excluir", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Admin-Token": token,
          "X-Subpage-Origin": "/acesso/demanda"
        },
        body: JSON.stringify({ id })
      });
      validarAcesso();
    }

    validarAcesso();
  </script>
</body>
</html>
